<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Bot Live Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f1419 0%, #1a1f2e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(15, 20, 31, 0.8);
            border-bottom: 2px solid #00d4ff;
            border-radius: 8px;
        }
        h1 { font-size: 32px; color: #00d4ff; }
        .status-badge { display: flex; align-items: center; gap: 15px; font-size: 14px; }
        .status-indicator {
            width: 12px;
            height: 12px;
            background: #00ff00;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .metric-card {
            background: rgba(30, 40, 60, 0.8);
            border: 1px solid #00d4ff;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }
        .metric-label { font-size: 12px; color: #00d4ff; text-transform: uppercase; margin-bottom: 8px; }
        .metric-value { font-size: 28px; font-weight: bold; color: #fff; }
        .loading { text-align: center; padding: 40px; color: #00d4ff; }
        .error { background: rgba(255, 68, 68, 0.1); border: 1px solid #ff4444; color: #ff8888; padding: 20px; border-radius: 8px; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>● Trading Bot Live Dashboard</h1>
            <div class="status-badge">
                <span class="status-indicator"></span>
                <span id="status-text">Connecting...</span>
            </div>
        </header>
        <div id="error-container"></div>
        <div class="metrics-grid" id="metrics-container">
            <div class="loading">Loading real-time data from Supabase...</div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ezalxvzpmrhrbncmqgjc.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_gSlBrJ_mrdoOLHATi4tGAg_8ViffrQs';

        async function updateDashboard() {
            try {
                const response = await fetch(
                    `${SUPABASE_URL}/rest/v1/portfolio_history?limit=1&order=created_at.desc`,
                    {
                        headers: {
                            'apikey': SUPABASE_KEY,
                            'Authorization': `Bearer ${SUPABASE_KEY}`
                        }
                    }
                );
                const data = await response.json();

                if (!data || data.length === 0) {
                    document.getElementById('metrics-container').innerHTML =
                        '<div class="error">No data available. Make sure the bot is syncing to Supabase.</div>';
                    return;
                }

                const latest = data[0];
                const metrics = [
                    { label: 'Equity', value: `$${latest.equity.toFixed(2)}` },
                    { label: 'Cash', value: `$${latest.cash.toFixed(2)}` },
                    { label: 'Total P&L', value: `$${latest.total_pnl.toFixed(2)}` },
                    { label: 'Win Rate', value: `${latest.win_rate.toFixed(1)}%` },
                    { label: 'Open Positions', value: latest.open_positions },
                    { label: 'Total Trades', value: latest.total_trades }
                ];

                const container = document.getElementById('metrics-container');
                container.innerHTML = metrics.map(m => `
                    <div class="metric-card">
                        <div class="metric-label">${m.label}</div>
                        <div class="metric-value">${m.value}</div>
                    </div>
                `).join('');

                document.getElementById('status-text').textContent =
                    `Connected • Last update: ${new Date().toLocaleTimeString()}`;

            } catch (error) {
                console.error(error);
                document.getElementById('error-container').innerHTML =
                    `<div class="error">Error connecting to Supabase: ${error.message}</div>`;
                document.getElementById('status-text').textContent = 'Connection failed';
            }
        }

        updateDashboard();
        setInterval(updateDashboard, 5000);
    </script>
</body>
</html>
